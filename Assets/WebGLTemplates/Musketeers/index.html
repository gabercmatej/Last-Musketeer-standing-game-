<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loader">
      <img id="logo" src="TemplateData/logo.png" alt="{{{ PRODUCT_NAME }}}" onerror="this.style.display='none';document.querySelector('#title').style.display='block';">
      <div id="title" style="display:none">{{{ PRODUCT_NAME }}}</div>
      <div id="subtitle">Version {{{ PRODUCT_VERSION }}}</div>
      <div id="bar" class="indeterminate"><div id="bar-fill"></div></div>
      <div id="status">Loading...</div>
    </div>
    <div id="warning"></div>
    <div id="footer">
      <span><b>Keep this tab open and visible while playing.</b> Hidden tabs pause the game.</span>
      <span>v{{{ PRODUCT_VERSION }}} &nbsp; <button id="fullscreen" type="button">Fullscreen</button></span>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#bar-fill");
      var statusEl = document.querySelector("#status");
      var loader = document.querySelector("#loader");
      var warning = document.querySelector("#warning");

      function showBanner(msg, type) {
        if (type === 'error') {
          warning.textContent = msg;
          warning.style.display = 'block';
        } else {
          console.warn(msg);
        }
      }

      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        autoSyncPersistentDataPath: true,
      };

      // Unity reports byte progress only when the server sends Content-Length. Netlify doesn't, and then
      // the loader only reports whole files done (0.9 * k / 3: 0, 0.3, 0.6, 0.9), which would freeze the
      // bar at 30% during the big download. So the bar sweeps (indeterminate) until a value that isn't one
      // of those steps shows up (real byte progress), then fills normally.
      var bar = document.querySelector("#bar");
      var determinate = false;
      function isFileStep(p) {
        for (var n = 1; n <= 4; n++)
          for (var k = 0; k <= n; k++)
            if (Math.abs(p - 0.9 * k / n) < 0.002) return true;
        return false;
      }
      createUnityInstance(canvas, config, function (progress) {
        if (!determinate && progress > 0.01 && progress < 0.85 && !isFileStep(progress)) {
          determinate = true;
          bar.classList.remove("indeterminate");
        }
        if (determinate) {
          fill.style.width = Math.round(progress * 100) + "%";
          statusEl.textContent = progress < 0.9 ? "Loading... " + Math.round(progress * 100) + "%" : "Starting...";
        } else {
          statusEl.textContent = progress < 0.9 ? "Loading the musketeers..." : "Starting...";
        }
      }).then(function (unityInstance) {
        loader.classList.add("done");
        canvas.focus();
        document.querySelector("#fullscreen").onclick = function () {
          unityInstance.SetFullscreen(1);
        };
      }).catch(function (message) {
        statusEl.textContent = "Couldn't start the game.";
        showBanner(String(message), 'error');
      });

      // Keyboard focus belongs to the game once the player clicks it.
      canvas.addEventListener("mousedown", function () { canvas.focus(); });
    </script>
  </body>
</html>
